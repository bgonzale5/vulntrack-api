# Application Info
quarkus.application.name=vulntrack-api
quarkus.application.version=1.0.0-SNAPSHOT

# HTTP Server
quarkus.http.port=8080
quarkus.http.test-port=8081

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=vulntrack
quarkus.datasource.password=vulntrack
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/vulntrack
quarkus.datasource.jdbc.max-size=16

# Hibernate ORM
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true

# CRÍTICO: Naming strategy para mapear camelCase -> snake_case
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway (Migraciones)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# GraphQL Configuration
quarkus.smallrye-graphql.root-path=/graphql
quarkus.smallrye-graphql.ui.always-include=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.vulntrack".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Dev Services (deshabilitado porque usamos Docker Compose)
quarkus.devservices.enabled=false


# FASE 1: CORS completamente abierto (VULNERABLE - permite CSRF)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:8000,http://localhost:8080,http://127.0.0.1:8000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=*
quarkus.http.cors.access-control-allow-credentials=true


# FASE 1: Introspection COMPLETAMENTE habilitada (VULNERABLE)
quarkus.smallrye-graphql.schema-available=true
quarkus.smallrye-graphql.show-runtime-exception-message=*
quarkus.smallrye-graphql.print-data-fetcher-exception=true

# Deshabilitar protecciones de introspection
quarkus.smallrye-graphql.events.enabled=false
mp.graphql.defaultErrorMessage=

# ============================================
# JWT Configuration (Fase 2 - Security)
# ============================================

# Issuer (quién emite el token)
mp.jwt.verify.issuer=https://vulntrack.io

# Clave pública para validar tokens (generaremos keypair después)
# Por ahora usamos una clave de desarrollo
smallrye.jwt.sign.key.location=/privateKey.pem
mp.jwt.verify.publickey.location=/publicKey.pem

# Tiempo de expiración del token (1 hora)
smallrye.jwt.new-token.lifespan=3600

# Claims adicionales
mp.jwt.token.header=Authorization
mp.jwt.token.cookie=jwt

# ============================================
# GraphQL Security (Fase 2)
# ============================================

# Deshabilitar introspection en producción
quarkus.smallrye-graphql.security.deny-introspection=true

# Query depth limiting (máximo 5 niveles)
quarkus.smallrye-graphql.max-depth=5

# Query complexity (prevenir DoS)
quarkus.smallrye-graphql.enable-query-batching=false